const libs = { react:['https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js','https://unpkg.com/react@18/umd/react.production.min.js'], reactdom:['https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js','https://unpkg.com/react-dom@18/umd/react-dom.production.min.js'], babel:['https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js','https://unpkg.com/@babel/standalone/babel.min.js'] };
function showError(title,detail) { document.getElementById('root').innerHTML = `<div class="loader error"><h1>${title}</h1><p>${detail}</p></div>`; }
function loadOne(urls,globalName) { return new Promise((resolve,reject)=>{ let i=0; const tryNext=()=>{ if(window[globalName]) return resolve(); if(i>=urls.length) return reject(new Error('No cargó '+globalName)); const s=document.createElement('script'); s.src=urls[i++]; s.crossOrigin='anonymous'; s.onload=()=>window[globalName]?resolve():tryNext(); s.onerror=tryNext; document.head.appendChild(s); }; tryNext(); }); }

async function boot() {
	try {
		await loadOne(libs.react, 'React');
		await loadOne(libs.reactdom, 'ReactDOM');
		await loadOne(libs.babel, 'Babel');
		// libs cargadas; ahora esperamos mensajes para renderizar con datos inyectados
		// Si ningún mensaje llega, podemos renderizar la versión por defecto si APP_SOURCE contiene SAMPLE.
		window.__megactivo_libs_ready = true;
	} catch (err) {
		console.error(err);
		showError('No se pudo cargar React en este HTML', String(err && err.message ? err.message : err));
	}
}

function renderPreview(injectedData) {
	try {
		if (!window.__megactivo_libs_ready) return showError('Librerías no cargadas', 'Intenta nuevamente en unos segundos.');
		let src = APP_SOURCE;
		if (injectedData) {
			// Reemplaza la definición de SAMPLE si existe
			src = src.replace(/const SAMPLE = [\s\S]*?;\n/, 'const SAMPLE = ' + JSON.stringify(injectedData) + ';\n');
		}
		const compiled = Babel.transform(src, { presets: ['react'] }).code;
		// Limpia root antes de renderizar
		const root = document.getElementById('root');
		root.innerHTML = '';
		(0, eval)(compiled);
	} catch (e) {
		console.error(e);
		showError('Error al renderizar', String(e && e.message ? e.message : e));
	}
}

window.addEventListener('message', (ev) => {
	try {
		const msg = ev.data || {};
		if (msg && msg.type === 'render') {
			renderPreview(msg.data || null);
		}
	} catch (e) { console.error('message handler', e); }
});

// iniciar la carga de librerías
boot();
